name: Import pinned TradingAgents source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tradingagents-source
  cancel-in-progress: false

env:
  TRADINGAGENTS_COMMIT: be952b8eccb49720509af544c6675233bc1f10d0
  TARGET_DIR: vendor/TradingAgents

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Clone exact upstream source
        run: |
          rm -rf "$TARGET_DIR"
          mkdir -p vendor
          git clone https://github.com/TauricResearch/TradingAgents.git "$TARGET_DIR"
          cd "$TARGET_DIR"
          git checkout "$TRADINGAGENTS_COMMIT"
          test "$(git rev-parse HEAD)" = "$TRADINGAGENTS_COMMIT"
          rm -rf .git .ruff_cache
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +

      - name: Verify imported source is clean
        run: |
          test -f "$TARGET_DIR/pyproject.toml"
          test -f "$TARGET_DIR/README.md"
          test -f "$TARGET_DIR/tradingagents/graph/trading_graph.py"
          test -f "$TARGET_DIR/tradingagents/llm_clients/factory.py"
          test -f "$TARGET_DIR/tests/test_provider_registry.py"
          ! find "$TARGET_DIR" -type d \( -name '.git' -o -name '.ruff_cache' -o -name '__pycache__' -o -name '*.egg-info' \) | grep .
          echo "Imported source: $TRADINGAGENTS_COMMIT"
          echo "Files: $(find "$TARGET_DIR" -type f | wc -l)"

      - name: Commit source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import pinned TradingAgents source $TRADINGAGENTS_COMMIT"
          git push origin HEAD:main
