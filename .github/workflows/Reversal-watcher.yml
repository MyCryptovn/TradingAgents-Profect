name: Reversal Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write

concurrency:
  group: tradingagents-top10-paper
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch open paper trades
        run: python -m scripts.watch_reversal

      - name: Commit ledger
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper-ledger
          git diff --staged --quiet || (git commit -m "watch ledger [skip ci]" && git pull --rebase && git push)
