on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
    - cron: "35 * * * *"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      # (giữ Checkout và Set up Python)

      - name: Watch open paper trades
        env:
          WATCH_MODE: shadow
          WATCH_LEDGER: paper-ledger-hl/ledger.json
          WATCH_LOOP_MINUTES: "30"
          WATCH_INTERVAL_SECONDS: "60"
        run: python -m scripts.watch_reversal

      - name: Commit ledger
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper-ledger-hl
          git diff --staged --quiet || (git commit -m "watch ledger [skip ci]" && git pull --rebase --autostash && git push)
