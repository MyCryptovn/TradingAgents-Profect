name: TradingAgents Top-10 Paper Effectiveness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/crypto_market_data.py"
      - "scripts/tradingagents_paper_pipeline.py"
      - "scripts/market_scanner.py"
      - ".github/workflows/tradingagents-top10-paper.yml"
      - "vendor/TradingAgents/**"
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: tradingagents-top10-paper
  cancel-in-progress: false

jobs:
  paper-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned TradingAgents source
        run: pip install -e vendor/TradingAgents

      - name: Validate crypto-native adapter
        run: python -m py_compile scripts/crypto_market_data.py scripts/tradingagents_paper_pipeline.py

      - name: Run Top-10 TradingAgents paper pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TRADINGAGENTS_LLM_PROVIDER: groq
          TRADINGAGENTS_DEEP_THINK_LLM: openai/gpt-oss-120b
          TRADINGAGENTS_QUICK_THINK_LLM: openai/gpt-oss-20b
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
          TRADINGAGENTS_LLM_MAX_RETRIES: "3"
        run: python -m scripts.tradingagents_paper_pipeline

      - name: Verify crypto-native routing and live trading gate
        run: |
          grep -R -q "YAHOO FINANCE BYPASSED" scripts/tradingagents_paper_pipeline.py
          grep -R -q "Kraken Spot public OHLC" scripts/crypto_market_data.py
          grep -R -q "Kraken live context" scripts/crypto_market_data.py
          ! grep -R -q "CoinGecko" scripts/crypto_market_data.py
          grep -R -q "REAL ORDERS: DISABLED" scripts/tradingagents_paper_pipeline.py
          grep -R -q "LIVE TRADING GATE: DISABLED" scripts/tradingagents_paper_pipeline.py
          grep -R -q "REVIEW DECISIONS: NEVER EXECUTED" scripts/tradingagents_paper_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tradingagents-paper-results/decisions.json")
          rows = json.loads(p.read_text())
          successful = [r for r in rows if r.get("outcome_status") != "ERROR"]
          if not successful:
              raise SystemExit("TradingAgents produced no successful analyses; failing the workflow instead of reporting a false green run.")
          print(f"Successful TradingAgents analyses: {len(successful)}/{len(rows)}")
          PY

      - name: Upload TradingAgents paper report
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-top10-paper-results
          path: tradingagents-paper-results/
          retention-days: 14
