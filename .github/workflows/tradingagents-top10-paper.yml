name: TradingAgents Top-10 Paper Effectiveness

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false 

jobs:
  paper-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned TradingAgents source
        run: pip install -e vendor/TradingAgents

      - name: Validate crypto-native adapter
        run: python -m py_compile scripts/crypto_market_data.py scripts/tradingagents_paper_pipeline.py scripts/market_scanner.py scripts/paper_ledger.py scripts/hl_feeder.py scripts/coinalyze_note.py 
      
      - name: Validate CoinMarketCap API access
        env:
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          COINMARKETCAP_API_BASE_URL: https://pro-api.coinmarketcap.com/
        run: |
          python - <<'PY'
          import os
          import urllib.request

          base = os.environ["COINMARKETCAP_API_BASE_URL"].rstrip("/") + "/"
          key = os.environ.get("COINMARKETCAP_API_KEY", "").strip()
          if not key:
              raise SystemExit("COINMARKETCAP_API_KEY GitHub Secret is missing.")
          # Sử dụng endpoint thông tin cơ bản hoặc cryptocurrency map của CMC để kiểm tra preflight
          url = base + "v1/cryptocurrency/map?limit=1"
          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "TradingAgents-Profect/coinmarketcap-preflight",
                  "X-CMC_PRO_API_KEY": key,
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print("COINMARKETCAP API PREFLIGHT:", response.read().decode("utf-8")[:200])
          PY

      - name: Run Top-10 TradingAgents paper pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_BASE_URL: https://generativelanguage.googleapis.com
          COINMARKETCAP_API_KEY: ${{ secrets.COINMARKETCAP_API_KEY }}
          COINMARKETCAP_API_BASE_URL: https://pro-api.coinmarketcap.com/
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LEDGER_FILE: "paper-ledger-hl/ledger.json"
          TRADINGAGENTS_LLM_PROVIDER: google
          TRADINGAGENTS_DEEP_THINK_LLM: gemini-3.1-flash-lite
          TRADINGAGENTS_QUICK_THINK_LLM: gemini-3.1-flash-lite
          TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
          TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
          TRADINGAGENTS_LLM_MAX_RETRIES: "3"
        run: python -m scripts.tradingagents_paper_pipeline

      - name: Verify crypto-native routing and live trading gate
        run: |
          grep -R -q "HYPERLIQUID" scripts/tradingagents_paper_pipeline.py
          grep -R -q "COINMARKETCAP" scripts/tradingagents_paper_pipeline.py
          grep -R -q "COINALYZE" scripts/tradingagents_paper_pipeline.py
          grep -R -q "KRAKEN" scripts/tradingagents_paper_pipeline.py
          grep -R -q "REAL ORDERS: DISABLED" scripts/tradingagents_paper_pipeline.py
          grep -R -q "LIVE TRADING GATE: DISABLED" scripts/tradingagents_paper_pipeline.py
          grep -R -q "REVIEW DECISIONS: NEVER EXECUTED" scripts/tradingagents_paper_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("tradingagents-paper-results/decisions.json")
          rows = json.loads(p.read_text())
          successful = [r for r in rows if r.get("outcome_status") != "ERROR"]
          if rows and not successful:
              raise SystemExit("TradingAgents produced no successful analyses; failing the workflow instead of reporting a false green run.")
          print(f"Successful TradingAgents analyses: {len(successful)}/{len(rows)}")
          PY

      - name: Record paper ledger
        env:
          CONFIG_TAG: "hl-v5"
          LEDGER_FILE: "paper-ledger-hl/ledger.json"
        run: python scripts/paper_ledger.py record

      - name: Score paper ledger
        env:
          LEDGER_FILE: "paper-ledger-hl/ledger.json"
        run: python scripts/paper_ledger.py score 
      
      - name: Show changed files
        run: git status --porcelain
      
      - name: Commit and push ledger changes
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper-ledger-hl/ledger.json paper-ledger-hl/report.md
          git diff --staged --quiet || (git commit -m "update paper ledger [skip ci]" && git pull --rebase origin main || (git rebase --abort && git pull origin main --strategy-option theirs) && git push origin main)

      - name: Upload TradingAgents paper report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-top10-paper-results
          path: tradingagents-paper-results/
          retention-days: 7
