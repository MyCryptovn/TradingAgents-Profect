name: TradingAgents Paper Trading Evaluation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tradingagents-paper-trade.yml'
      - 'vendor/TradingAgents/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DIR: vendor/TradingAgents-v0.4.2-test
  TRADINGAGENTS_UPSTREAM_COMMIT: be952b8eccb49720509af544c6675233bc1f10d0
  TRADINGAGENTS_SOURCE_LABEL: v0.4.2
  TRADINGAGENTS_LLM_PROVIDER: groq
  TRADINGAGENTS_DEEP_THINK_LLM: openai/gpt-oss-120b
  TRADINGAGENTS_QUICK_THINK_LLM: openai/gpt-oss-120b
  TRADINGAGENTS_MAX_DEBATE_ROUNDS: '1'
  TRADINGAGENTS_MAX_RISK_ROUNDS: '1'
  TRADINGAGENTS_TEMPERATURE: '0.1'
  TRADINGAGENTS_LLM_MAX_RETRIES: '2'
  TRADINGAGENTS_MAX_TOKENS: '2048'
  TRADINGAGENTS_BEAR_INPUT_TOKEN_BUDGET: '6000'
  TRADINGAGENTS_OUTPUT_LANGUAGE: English
  TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/paper-results
  TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/paper-cache
  TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/paper-results/trading_memory.md

jobs:
  paper-trade:
    name: BTC-USD TradingAgents v0.4.2 paper evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch exact TradingAgents v0.4.2 source
        run: |
          rm -rf "$SOURCE_DIR"
          git clone --filter=blob:none https://github.com/TauricResearch/TradingAgents.git "$SOURCE_DIR"
          git -C "$SOURCE_DIR" checkout --detach "$TRADINGAGENTS_UPSTREAM_COMMIT"
          test "$(git -C "$SOURCE_DIR" rev-parse HEAD)" = "$TRADINGAGENTS_UPSTREAM_COMMIT"
          echo "TradingAgents source label: $TRADINGAGENTS_SOURCE_LABEL"
          echo "TradingAgents commit: $(git -C "$SOURCE_DIR" rev-parse HEAD)"
          echo "Package metadata version (upstream commit): $(grep '^version = ' "$SOURCE_DIR/pyproject.toml")"

      - name: Verify paper-test prerequisites
        run: |
          test -f "$SOURCE_DIR/pyproject.toml"
          test -f "$SOURCE_DIR/tradingagents/graph/trading_graph.py"
          test -n "$GROQ_API_KEY" || { echo 'GROQ_API_KEY GitHub Actions secret is required for the live-agent paper test.'; exit 1; }
          echo 'REAL MONEY TRADING: DISABLED'
          echo 'Exchange execution: DISABLED'
          echo 'Mode: historical point-in-time paper evaluation'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vendor/TradingAgents-v0.4.2-test/pyproject.toml

      - name: Install TradingAgents v0.4.2
        working-directory: vendor/TradingAgents-v0.4.2-test
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Apply minimal Groq context guard
        working-directory: vendor/TradingAgents-v0.4.2-test
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tradingagents/agents/researchers/bear_researcher.py')
          text = path.read_text(encoding='utf-8')
          marker = 'TRADINGAGENTS_BEAR_INPUT_TOKEN_BUDGET'
          if marker in text:
              print('Bear researcher context guard already present; leaving source unchanged.')
              raise SystemExit(0)

          old = '''        prompt = f"""You are a Bear Analyst making the case against investing in the {target_label}. Your goal is to present a well-reasoned argument emphasizing risks, challenges, and negative indicators. Leverage the provided research and data to highlight potential downsides and counter bullish arguments effectively.\n\nKey points to focus on:\n\n- Risks and Challenges: Highlight factors like market saturation, financial instability, or macroeconomic threats that could hinder the stock's performance.\n- Competitive Weaknesses: Emphasize vulnerabilities such as weaker market positioning, declining innovation, or threats from competitors.\n- Negative Indicators: Use evidence from financial data, market trends, or recent adverse news to support your position.\n- Bull Counterpoints: Critically analyze the bull argument with specific data and sound reasoning, exposing weaknesses or over-optimistic assumptions.\n- Engagement: Present your argument in a conversational style, directly engaging with the bull analyst's points and debating effectively rather than simply listing facts.\n\nResources available:\n\n{instrument_context}\nMarket research report: {market_research_report}\nSocial media sentiment report: {sentiment_report}\nLatest world affairs news: {news_report}\n{fundamentals_label}: {fundamentals_report}\nConversation history of the debate: {history}\nLast bull argument: {current_response}\nUse this information to deliver a compelling bear argument, refute the bull's claims, and engage in a dynamic debate that demonstrates the risks and weaknesses of investing in the {target_label}.\n""" + get_language_instruction()'''

          new = '''        # Groq returned HTTP 413 because the Bear Researcher prompt could grow to ~9.9K
        # input tokens. Keep the native TradingAgents pipeline, but bound the assembled
        # research context before the request is sent. Character budgeting is deliberately
        # conservative (~4 chars/token) so the prompt remains below the 6K-token target.
        token_budget = 6000
        try:
            token_budget = int(__import__('os').environ.get('TRADINGAGENTS_BEAR_INPUT_TOKEN_BUDGET', '6000'))
        except ValueError:
            token_budget = 6000
        token_budget = max(1000, min(token_budget, 6000))

        sections = [
            ('instrument', instrument_context),
            ('market', market_research_report),
            ('sentiment', sentiment_report),
            ('news', news_report),
            ('fundamentals', fundamentals_report),
            ('history', history),
            ('bull', current_response),
        ]
        fixed_prompt = f"""You are a Bear Analyst making the case against investing in the {target_label}. Your goal is to present a well-reasoned argument emphasizing risks, challenges, and negative indicators. Leverage the provided research and data to highlight potential downsides and counter bullish arguments effectively.\n\nKey points to focus on:\n\n- Risks and Challenges\n- Competitive Weaknesses\n- Negative Indicators\n- Bull Counterpoints\n- Engagement: directly address the bull analyst's points.\n\nUse the following research context. Preserve the most recent and decision-relevant evidence.\n"""
        suffix = f"\nUse this information to deliver a compelling bear argument, refute the bull's claims, and engage in a dynamic debate that demonstrates the risks and weaknesses of investing in the {target_label}.\n""" + get_language_instruction()

        # Reserve room for instructions/suffix and use a conservative 4 chars/token estimate.
        available_chars = max(4000, (token_budget * 4) - len(fixed_prompt) - len(suffix))
        weights = {
            'instrument': 1.0,
            'market': 1.25,
            'sentiment': 0.9,
            'news': 1.15,
            'fundamentals': 0.7,
            'history': 0.55,
            'bull': 1.0,
        }
        total_weight = sum(weights[name] for name, _ in sections)

        rendered = []
        used_chars = 0
        labels = {
            'instrument': 'Resources available',
            'market': 'Market research report',
            'sentiment': 'Social media sentiment report',
            'news': 'Latest world affairs news',
            'fundamentals': fundamentals_label,
            'history': 'Conversation history of the debate',
            'bull': 'Last bull argument',
        }
        for name, value in sections:
            value = str(value or '').strip()
            budget = max(600, int(available_chars * weights[name] / total_weight))
            if len(value) > budget:
                # Keep both recent/end context and the beginning of the report.
                head = max(300, budget // 3)
                tail = max(300, budget - head)
                value = value[:head] + '\\n...[context truncated for Groq 6K input budget]...\\n' + value[-tail:]
            block = f"{labels[name]}: {value}"
            rendered.append(block)
            used_chars += len(block)

        prompt = fixed_prompt + '\\n\\n' + '\\n'.join(rendered) + suffix
        approx_tokens = (len(prompt) + 3) // 4
        print(f'BEAR INPUT GUARD: chars={len(prompt)} approx_tokens={approx_tokens} budget={token_budget}')
        if approx_tokens > token_budget:
            # Final deterministic trim, retaining the beginning and end of the assembled prompt.
            target_chars = token_budget * 4
            head = target_chars // 2
            tail = target_chars - head
            prompt = prompt[:head] + '\\n...[final context trim]...\\n' + prompt[-tail:]
            print(f'BEAR INPUT GUARD FINAL: chars={len(prompt)} approx_tokens={(len(prompt) + 3) // 4}')'''

          if old not in text:
              raise SystemExit('Expected upstream Bear Researcher prompt block was not found; refusing to patch.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Applied minimal Bear Researcher context guard: max 6000 approximate input tokens.')
          PY

      - name: Verify paper-test prerequisites after context guard
        working-directory: vendor/TradingAgents-v0.4.2-test
        run: |
          python -m py_compile tradingagents/agents/researchers/bear_researcher.py
          grep -n 'BEAR INPUT GUARD' tradingagents/agents/researchers/bear_researcher.py

      - name: Run historical paper trades
        working-directory: vendor/TradingAgents-v0.4.2-test
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import re
          from datetime import timedelta
          import yfinance as yf
          from tradingagents.graph.trading_graph import TradingAgentsGraph
          from tradingagents.default_config import DEFAULT_CONFIG

          ticker = 'BTC-USD'
          dates = ['2026-01-15', '2026-03-16', '2026-06-15']
          horizon = 5

          config = DEFAULT_CONFIG.copy()
          config['llm_provider'] = 'groq'
          config['deep_think_llm'] = os.environ['TRADINGAGENTS_DEEP_THINK_LLM']
          config['quick_think_llm'] = os.environ['TRADINGAGENTS_QUICK_THINK_LLM']
          config['max_debate_rounds'] = 1
          config['max_risk_discuss_rounds'] = 1
          config['temperature'] = 0.1
          config['llm_max_retries'] = 2
          config['max_tokens'] = 2048
          config['results_dir'] = os.environ['TRADINGAGENTS_RESULTS_DIR']
          config['data_cache_dir'] = os.environ['TRADINGAGENTS_CACHE_DIR']
          config['memory_log_path'] = os.environ['TRADINGAGENTS_MEMORY_LOG_PATH']

          os.makedirs(config['results_dir'], exist_ok=True)
          os.makedirs(config['data_cache_dir'], exist_ok=True)

          ta = TradingAgentsGraph(
              selected_analysts=('market', 'social', 'news', 'fundamentals'),
              debug=False,
              config=config,
          )

          rows = []
          for trade_date in dates:
              print(f'\n===== PAPER TRADE {ticker} @ {trade_date} =====')
              _, decision = ta.propagate(ticker, trade_date, asset_type='crypto')
              raw = decision if isinstance(decision, str) else json.dumps(decision, ensure_ascii=False, default=str)
              print('AGENT DECISION:', raw)

              action = 'UNKNOWN'
              if isinstance(decision, dict):
                  for key in ('action', 'decision', 'signal'):
                      value = decision.get(key)
                      if value:
                          action = str(value).upper()
                          break
              if action == 'UNKNOWN':
                  m = re.search(r'\b(BUY|SELL|HOLD)\b', raw.upper())
                  if m:
                      action = m.group(1)

              start = yf.Ticker(ticker).history(
                  start=trade_date,
                  end=(__import__('datetime').datetime.strptime(trade_date, '%Y-%m-%d') + timedelta(days=horizon + 7)).strftime('%Y-%m-%d'),
                  auto_adjust=False,
              )
              if len(start) <= horizon:
                  raise RuntimeError(f'Insufficient future bars for {trade_date}')

              entry = float(start['Close'].iloc[0])
              exit_price = float(start['Close'].iloc[horizon])
              future_return = (exit_price - entry) / entry

              if action == 'BUY':
                  outcome = 'CORRECT' if future_return > 0 else 'WRONG'
              elif action == 'SELL':
                  outcome = 'CORRECT' if future_return < 0 else 'WRONG'
              elif action == 'HOLD':
                  outcome = 'NO_POSITION'
              else:
                  outcome = 'UNPARSED'

              rows.append({
                  'ticker': ticker,
                  'trade_date': trade_date,
                  'action': action,
                  'entry_price': entry,
                  'exit_price_5d': exit_price,
                  'future_return_5d': future_return,
                  'outcome': outcome,
              })

              print(f'ACTION={action} | 5D RETURN={future_return:.4%} | OUTCOME={outcome}')

          out = os.path.join(config['results_dir'], 'paper_trade_results.csv')
          with open(out, 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=rows[0].keys())
              writer.writeheader()
              writer.writerows(rows)

          actionable = [r for r in rows if r['action'] in ('BUY', 'SELL') and r['outcome'] in ('CORRECT', 'WRONG')]
          correct = sum(r['outcome'] == 'CORRECT' for r in actionable)
          accuracy = correct / len(actionable) if actionable else None
          compounded = 1.0
          for r in actionable:
              if r['action'] == 'BUY':
                  compounded *= 1 + r['future_return_5d']
              elif r['action'] == 'SELL':
                  compounded *= 1 - r['future_return_5d']

          summary = {
              'mode': 'historical paper trading only',
              'real_money': False,
              'tradingagents_source_label': os.environ['TRADINGAGENTS_SOURCE_LABEL'],
              'tradingagents_commit': os.environ['TRADINGAGENTS_UPSTREAM_COMMIT'],
              'bear_input_token_budget': int(os.environ['TRADINGAGENTS_BEAR_INPUT_TOKEN_BUDGET']),
              'ticker': ticker,
              'samples': len(rows),
              'actionable_samples': len(actionable),
              'correct_actionable': correct,
              'action_accuracy': accuracy,
              'sequential_actionable_return': compounded - 1 if actionable else None,
              'results_file': out,
          }
          with open(os.path.join(config['results_dir'], 'paper_trade_summary.json'), 'w', encoding='utf-8') as f:
              json.dump(summary, f, indent=2)

          print('\n===== PAPER TEST SUMMARY =====')
          print(json.dumps(summary, indent=2))
          print('REAL MONEY TRADING: DISABLED')
          PY

      - name: Upload paper-test results
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-v0.4.2-paper-trade-results
          path: paper-results/
          if-no-files-found: error
          retention-days: 30
