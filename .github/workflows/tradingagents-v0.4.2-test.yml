name: TradingAgents v0.4.2 - Repository Source Test

on:
  push:
    branches: [main, tradingagents-v0.4.2-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tradingagents-v0.4.2-${{ github.ref }}
  cancel-in-progress: true

env:
  TRADINGAGENTS_COMMIT: be952b8eccb49720509af544c6675233bc1f10d0
  SOURCE_DIR: vendor/TradingAgents

jobs:
  full-source-test:
    name: TradingAgents repository-source test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify pinned TradingAgents source is present
        run: |
          test -f "$SOURCE_DIR/pyproject.toml"
          test -f "$SOURCE_DIR/README.md"
          test -f "$SOURCE_DIR/tradingagents/graph/trading_graph.py"
          test -f "$SOURCE_DIR/tradingagents/llm_clients/factory.py"
          test -f "$SOURCE_DIR/tests/test_provider_registry.py"
          ! find "$SOURCE_DIR" -type d \( -name '.git' -o -name '.ruff_cache' -o -name '__pycache__' -o -name '*.egg-info' \) | grep .
          echo "Expected upstream commit: $TRADINGAGENTS_COMMIT"
          echo "Repository source files: $(find "$SOURCE_DIR" -type f | wc -l)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vendor/TradingAgents/pyproject.toml

      - name: Install full project with development dependencies
        working-directory: vendor/TradingAgents
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Clean-install import check
        working-directory: vendor/TradingAgents
        run: |
          python -c "import tradingagents, cli.main; print('clean import OK')"

      - name: Run complete test suite
        working-directory: vendor/TradingAgents
        run: pytest -q

      - name: Run strict lint
        working-directory: vendor/TradingAgents
        run: ruff check .

      - name: Package repository source artifact
        run: |
          cd vendor
          tar --exclude='.git' -czf TradingAgents-v0.4.2-repository-source.tar.gz TradingAgents
          sha256sum TradingAgents-v0.4.2-repository-source.tar.gz | tee TradingAgents-v0.4.2-repository-source.sha256

      - name: Upload repository source artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAgents-v0.4.2-repository-source
          path: |
            vendor/TradingAgents-v0.4.2-repository-source.tar.gz
            vendor/TradingAgents-v0.4.2-repository-source.sha256
          if-no-files-found: error
          retention-days: 30
