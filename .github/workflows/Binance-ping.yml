name: Binance connectivity test
on:
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Binance spot and testnet
        run: |
          for url in https://api.binance.com/api/v3/ping https://testnet.binance.vision/api/v3/ping; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "$url -> HTTP $code"
          done
