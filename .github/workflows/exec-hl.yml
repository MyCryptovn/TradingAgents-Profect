name: Exec Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run exec dry-run
        run: python -m scripts.exec_hl

      - name: Show output
        run: cat tradingagents-paper-results/exec_dryrun.json
