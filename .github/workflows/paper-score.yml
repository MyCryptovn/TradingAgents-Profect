name: Paper score

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tradingagents-top10-paper

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score paper trades
        run: python scripts/paper_ledger.py score
      - name: Commit ledger
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper-ledger
          git diff --staged --quiet || (git commit -m "update paper ledger [skip ci]" && git pull --rebase && git push)
