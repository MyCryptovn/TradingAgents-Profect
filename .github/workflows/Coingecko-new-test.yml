name: CoinGecko News test

on:
  workflow_dispatch:

jobs:
  news-test:
    runs-on: ubuntu-latest
    steps:
      - name: Call CoinGecko news endpoint with Demo key
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          code=$(curl -s -o news.json -w "%{http_code}" -H "x-cg-demo-api-key: $COINGECKO_API_KEY" "https://api.coingecko.com/api/v3/news?coin_id=bitcoin&per_page=3")
          echo "HTTP $code"
          head -c 400 news.json
